# M8 (2026-10-14) Perfetto battery counters config (text proto · https://perfetto.dev/docs/data-sources/battery-counters) — P0 계측 PERFETTO_ON 세션 (호스트 adb shell perfetto · 앱 변경 0).
# 지원 여부 (android.power 데이터소스 · 권한 · 오버헤드) 는 스모크 ID 로 먼저 확인 → 지원 / 미지원 / 미확인 원장. duration 은 세션 상한 (845 s) 보다 길게 두고 pkill -INT 로 끝낸다.
duration_ms: 1200000
buffers: {
  size_kb: 65536
  fill_policy: RING_BUFFER
}
data_sources: {
  config {
    name: "android.power"
    android_power_config {
      battery_poll_ms: 900
      battery_counters: BATTERY_COUNTER_CAPACITY_PERCENT
      battery_counters: BATTERY_COUNTER_CHARGE
      battery_counters: BATTERY_COUNTER_CURRENT
      battery_counters: BATTERY_COUNTER_VOLTAGE
      collect_power_rails: true
    }
  }
}
