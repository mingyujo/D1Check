  NPU->GPU:   {value: {cold: 0.406, hot: 0.805}, status: measured, source: "v1 (M2r C/H arms)"}
  same:       {value: 0.0, status: placeholder, source: "v1 (10/3 same-resource transitions 131~214 ms were warmup/re-check only [P])"}
  hot_rule:   {value: "hot if device status >= 1 or SKIN >= 40 at the switch", status: placeholder, source: "v1 [E]"}
