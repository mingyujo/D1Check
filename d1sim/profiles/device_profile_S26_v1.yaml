# D1 simulator v1 — Galaxy S26 (SM-S942N, Exynos 2600) device profile (2026-10-03). v0 file device_profile_S26.yaml is untouched.
# Every leaf is {value, status, source}. status: measured | measured-fit | placeholder | untested | unsupported. value null -> MASKED.
# Engines: GPU·NPU = npu-runner CompiledModel (LiteRT 2.2.0); CPU4 = benchmark-runner Interpreter 1.4.2 XNNPACK 4 threads (engine footnote).
# Throttle model v1 = d1sim/throttle_v1.py (form M-P, see throttle_v1_*.json). STATUS OF v1: 모형 미완 — checklist 2/7
# (sim/스로틀모형_v1.md §3). Nothing here is validated on unseen data; tonight (2026-10-03 night) is the first true holdout.
device: S26
profile_version: v1-2026-10-03
model: mobilenet_v1_1.0_224

